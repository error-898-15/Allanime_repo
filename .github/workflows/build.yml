name: Build Plugins

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Normalize Manifests & Prepare Environment
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +
          echo "Environment ready."

      - name: Build Plugins & Manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew make makePluginsJson --stacktrace || ./gradlew make --stacktrace
          else
            gradle make makePluginsJson --stacktrace || gradle make --stacktrace
          fi

      - name: Execute Plugin Updater & Ensure Real Metadata, Hashes & Catalog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "plugin_update.py" ]; then
            python3 plugin_update.py
          else
            cat << 'PYEOF' > /tmp/update_plugins.py
          import json, glob, zipfile, os, hashlib

          REPO = os.environ.get("GITHUB_REPOSITORY", "error-898-15/Allanime_repo")

          PLUGIN_META = {
              'AnimeDubHindiPlugin': {
                  'name': 'Anime Dub Hindi',
                  'description': 'AnimeDubHindi - Watch Hindi, Tamil, Telugu, and Multi-Audio Anime & Movies with High-Speed Direct Cloud CDN (HubCloud & GDFlix)',
                  'language': 'hi',
                  'authors': ['error-898-15'],
                  'tvTypes': ['Anime', 'AnimeMovie', 'Movie', 'TvSeries'],
                  'iconUrl': 'https://www.animedubhindi.link/wp-content/uploads/2024/07/Untitled-design.png',
                  'status': 1
              },
              'BlakitePlugin': {
                  'name': 'Blakite Anime',
                  'description': 'Blakite Provider - Stream Hindi Dubbed Anime & Cartoons directly via Blakite network',
                  'language': 'hi',
                  'authors': ['error-898-15'],
                  'tvTypes': ['Anime', 'AnimeMovie', 'Cartoon'],
                  'iconUrl': 'https://blogger.googleusercontent.com/img/a/AVvXsEgWJNM8v7dkKlHDuBncLOZsjiURJtbxv6de_W_TkIg75W51emlvr-3DATj02j__QUikkzjxhYKv8jYtQp4lc04xObvSTvthIHg_DA0Ud4SRiEUKqralljdfKnUumPN96NEBQwW6y0SpVKcCCPzuIwh8on5sgzjH7BT5PpR6_vp_qS7Qia8OMj04qz-DyMw=s937',
                  'status': 1
              },
              'AnimeSaltPlugin': {
                  'name': 'AnimeSalt',
                  'description': 'AnimeSalt Provider - Watch high quality subbed and dubbed anime releases',
                  'language': 'en',
                  'authors': ['error-898-15'],
                  'tvTypes': ['Anime', 'AnimeMovie', 'OVA'],
                  'iconUrl': 'https://animesalt.cx/wp-content/uploads/cropped-AnimeSalticon-270x270.png',
                  'status': 1
              },
              'GogoanimePlugin': {
                  'name': 'Gogoanime',
                  'description': 'Gogoanime Provider - Fast video streams for the latest seasonal anime episodes',
                  'language': 'en',
                  'authors': ['error-898-15'],
                  'tvTypes': ['Anime', 'AnimeMovie', 'OVA'],
                  'iconUrl': 'https://i3.wp.com/gogoanime.by/wp-content/uploads/2024/05/cropped-favicon-2-192x192.png',
                  'status': 1
              },
              'YoutubePlugin': {
                  'name': 'YouTube',
                  'description': 'YouTube - Stream trending videos, music, gaming, news, and official channels directly on CloudStream',
                  'language': 'en',
                  'authors': ['error-898-15'],
                  'tvTypes': ['Others', 'Live', 'TvSeries'],
                  'iconUrl': 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png',
                  'status': 1
              },
              'VidSrcPlugin': {
                  'name': 'VidSrc',
                  'description': 'VidSrc (https://vidsrc.sbs/) - Watch Movies & TV Series in HD with multi-server playback (Pro Multi, CineSrc, Videasy 4K, VidSrc)',
                  'language': 'en',
                  'authors': ['error-898-15'],
                  'tvTypes': ['Movie', 'TvSeries'],
                  'iconUrl': 'https://images2.imgbox.com/6c/fb/hHqTqE7b_o.png',
                  'status': 1
              }
          }

          cs3_hashes = {}
          for cs3_file in glob.glob('**/*.cs3', recursive=True):
              base = os.path.basename(cs3_file)
              try:
                  with zipfile.ZipFile(cs3_file, 'r') as zin:
                      items = {name: zin.read(name) for name in zin.namelist()}
                  if 'manifest.json' in items:
                      manifest = json.loads(items['manifest.json'].decode('utf-8'))
                      for plugin_key, meta in PLUGIN_META.items():
                          if plugin_key.lower() in base.lower() or manifest.get('internalName', '').lower() == plugin_key.lower():
                              manifest['name'] = meta['name']
                              manifest['iconUrl'] = meta['iconUrl']
                              manifest['description'] = meta['description']
                              manifest['language'] = meta['language']
                              manifest['tvTypes'] = meta['tvTypes']
                      items['manifest.json'] = json.dumps(manifest, indent=2).encode('utf-8')
                      with zipfile.ZipFile(cs3_file, 'w', zipfile.ZIP_DEFLATED) as zout:
                          for name, data in items.items():
                              zout.writestr(name, data)

                  with open(cs3_file, 'rb') as f:
                      content = f.read()
                  h = 'sha256-' + hashlib.sha256(content).hexdigest()
                  sz = len(content)
                  cs3_hashes[base] = (h, sz)
              except Exception as e:
                  print('Warning on cs3:', e)

          for pjson in ['build/plugins.json', 'plugins.json']:
              if os.path.exists(pjson):
                  try:
                      with open(pjson, 'r') as f:
                          data = json.load(f)
                      for item in data:
                          iname = item.get('internalName', '')
                          for plugin_key, meta in PLUGIN_META.items():
                              if iname.lower() == plugin_key.lower() or plugin_key.lower() in item.get('url', '').lower():
                                  item['name'] = meta['name']
                                  item['iconUrl'] = meta['iconUrl']
                                  item['description'] = meta['description']
                                  item['language'] = meta['language']
                                  item['tvTypes'] = meta['tvTypes']
                          for base, (h, sz) in cs3_hashes.items():
                              if base in item.get('url', '') or iname in base:
                                  item['fileHash'] = h
                                  item['fileSize'] = sz
                      with open(pjson, 'w') as f:
                          json.dump(data, f, indent=2)
                  except Exception as e:
                      print('Warning on pjson:', e)
          PYEOF
            python3 /tmp/update_plugins.py
          fi

      - name: Verify Output Artifacts
        run: |
          echo "=== Verifying Generated Files ==="
          mkdir -p $RUNNER_TEMP/build_artifacts
          find . -name "*.cs3" -exec cp -t $RUNNER_TEMP/build_artifacts/ {} + 2>/dev/null || true
          find . -name "*.jar" ! -name "gradle-wrapper.jar" -exec cp -t $RUNNER_TEMP/build_artifacts/ {} + 2>/dev/null || true
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json $RUNNER_TEMP/build_artifacts/
          elif [ -f "plugins.json" ]; then
            cp plugins.json $RUNNER_TEMP/build_artifacts/
          fi
          if [ -f "repo.json" ]; then
            cp repo.json $RUNNER_TEMP/build_artifacts/
          fi
          ls -la $RUNNER_TEMP/build_artifacts/

      - name: Upload Build Artifacts (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: ${{ runner.temp }}/build_artifacts/*
          retention-days: 14
          if-no-files-found: warn

      - name: Deploy to Builds Branch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          if [ -d "$RUNNER_TEMP/build_artifacts" ]; then
            cp -r "$RUNNER_TEMP/build_artifacts/." ./
          fi
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Automated build: ${{ github.sha }}"
            git push origin builds --force
          fi
