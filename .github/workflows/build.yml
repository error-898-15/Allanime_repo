name: Build Plugins

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Normalize Manifests & Prepare Environment
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +
          echo "Environment ready."

      - name: Build Plugins & Manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew make makePluginsJson --stacktrace || ./gradlew make --stacktrace
          else
            gradle make makePluginsJson --stacktrace || gradle make --stacktrace
          fi

      - name: Ensure Real Plugin Names, Official Logos & Valid Hashes
        run: |
          python3 -c "
          import json, glob, zipfile, os, hashlib

          PLUGIN_META = {
              'BlakitePlugin': {
                  'name': 'Blakite Anime',
                  'iconUrl': 'https://blogger.googleusercontent.com/img/a/AVvXsEgWJNM8v7dkKlHDuBncLOZsjiURJtbxv6de_W_TkIg75W51emlvr-3DATj02j__QUikkzjxhYKv8jYtQp4lc04xObvSTvthIHg_DA0Ud4SRiEUKqralljdfKnUumPN96NEBQwW6y0SpVKcCCPzuIwh8on5sgzjH7BT5PpR6_vp_qS7Qia8OMj04qz-DyMw=s937'
              },
              'ZLivePlugin': {
                  'name': 'ZLive',
                  'iconUrl': 'https://ui-avatars.com/api/?name=ZLive&background=0d0d0d&color=8288fe&size=512&bold=true&length=2'
              },
              'AnimeDekhoPlugin': {
                  'name': 'AnimeDekho',
                  'iconUrl': 'https://animedekho.app/wp-content/uploads/2023/02/cropped-favicon-270x270.png'
              }
          }

          cs3_hashes = {}
          for cs3_file in glob.glob('**/*.cs3', recursive=True):
              base = os.path.basename(cs3_file)
              with zipfile.ZipFile(cs3_file, 'r') as zin:
                  items = {name: zin.read(name) for name in zin.namelist()}
              if 'manifest.json' in items:
                  manifest = json.loads(items['manifest.json'].decode('utf-8'))
                  for plugin_key, meta in PLUGIN_META.items():
                      if plugin_key.lower() in base.lower() or manifest.get('internalName', '').lower() == plugin_key.lower():
                          manifest['name'] = meta['name']
                          if 'iconUrl' in meta:
                              manifest['iconUrl'] = meta['iconUrl']
                  items['manifest.json'] = json.dumps(manifest, indent=2).encode('utf-8')
                  with zipfile.ZipFile(cs3_file, 'w', zipfile.ZIP_DEFLATED) as zout:
                      for name, data in items.items():
                          zout.writestr(name, data)
              
              with open(cs3_file, 'rb') as f:
                  content = f.read()
              h = 'sha256-' + hashlib.sha256(content).hexdigest()
              sz = len(content)
              cs3_hashes[base] = (h, sz)

          for pjson in ['build/plugins.json', 'plugins.json']:
              if os.path.exists(pjson):
                  with open(pjson, 'r') as f:
                      data = json.load(f)
                  for item in data:
                      iname = item.get('internalName', '')
                      for plugin_key, meta in PLUGIN_META.items():
                          if iname.lower() == plugin_key.lower() or plugin_key.lower() in item.get('url', '').lower():
                              item['name'] = meta['name']
                              item['iconUrl'] = meta['iconUrl']
                      for base, (h, sz) in cs3_hashes.items():
                          if base in item.get('url', '') or iname in base:
                              item['fileHash'] = h
                              item['fileSize'] = sz
                  with open(pjson, 'w') as f:
                      json.dump(data, f, indent=2)
          "

      - name: Verify Output Artifacts
        run: |
          echo "=== Verifying Generated Files ==="
          mkdir -p $RUNNER_TEMP/build_artifacts
          find . -name "*.cs3" -exec cp {} $RUNNER_TEMP/build_artifacts/ \;
          find . -name "*.jar" ! -name "gradle-wrapper.jar" -exec cp {} $RUNNER_TEMP/build_artifacts/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json $RUNNER_TEMP/build_artifacts/
          elif [ -f "plugins.json" ]; then
            cp plugins.json $RUNNER_TEMP/build_artifacts/
          fi
          if [ -f "repo.json" ]; then
            cp repo.json $RUNNER_TEMP/build_artifacts/
          fi
          ls -la $RUNNER_TEMP/build_artifacts/

      - name: Upload Build Artifacts (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: ${{ runner.temp }}/build_artifacts/*
          retention-days: 14

      - name: Deploy to Builds Branch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp -r $RUNNER_TEMP/build_artifacts/* ./
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Automated build: ${{ github.sha }}"
            git push origin builds --force
          fi
