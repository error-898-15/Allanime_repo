name: Build Plugins

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Prepare Builds Directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/builds
          if [ ! -d ".git" ]; then
            git init -b builds
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} || true
          fi
          rm -f *.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Verify .cs3 Artifact Generation
        run: |
          echo "Verifying generated .cs3 artifacts..."
          CS3_FILES=$(find $GITHUB_WORKSPACE/src -name "*.cs3" -type f)
          if [ -z "$CS3_FILES" ]; then
            echo "::error::CRITICAL FAILURE: No .cs3 files were generated by the build!"
            exit 1
          fi
          echo "Found generated .cs3 files:"
          echo "$CS3_FILES"
          
          # Copy to builds directory
          cp $CS3_FILES $GITHUB_WORKSPACE/builds/
          
          # Check plugins.json
          if [ -f "$GITHUB_WORKSPACE/src/build/plugins.json" ]; then
            cp "$GITHUB_WORKSPACE/src/build/plugins.json" $GITHUB_WORKSPACE/builds/
            echo "Copied build/plugins.json to builds branch folder"
          else
            echo "::error::CRITICAL FAILURE: plugins.json was not generated!"
            exit 1
          fi
          
          # Copy repo.json if present in src
          if [ -f "$GITHUB_WORKSPACE/src/repo.json" ]; then
            cp "$GITHUB_WORKSPACE/src/repo.json" $GITHUB_WORKSPACE/builds/
          fi
          
          # Copy icon.png if present in src
          if [ -f "$GITHUB_WORKSPACE/src/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/src/icon.png" $GITHUB_WORKSPACE/builds/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: |
            builds/*.cs3
            builds/*.json
          retention-days: 14

      - name: Push to Builds Branch
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add .
          git commit -m "Automated build: ${{ github.sha }}" || exit 0
          git push origin builds --force
