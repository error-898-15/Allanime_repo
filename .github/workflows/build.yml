name: Build Plugins

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Prepare Gradlew Permissions & Clean Manifests
        run: |
          chmod +x gradlew || true
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +
          echo "Environment ready."

      - name: Build Plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew make --stacktrace || gradle make --stacktrace
          else
            gradle make --stacktrace
          fi

      - name: Generate plugins.json Catalog
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew makePluginsJson --stacktrace || true
          else
            gradle makePluginsJson --stacktrace || true
          fi

      - name: Run Plugin Updater & Sync Catalog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "plugin_update.py" ]; then
            python3 plugin_update.py
          elif [ -f ".github/scripts/plugin_update.py" ]; then
            python3 .github/scripts/plugin_update.py
          else
            echo "plugin_update.py not found, proceeding with built plugins."
          fi

      - name: Verify Output Artifacts
        run: |
          echo "=== Verifying Generated Files ==="
          mkdir -p $RUNNER_TEMP/build_artifacts
          find . -name "*.cs3" -exec cp -t $RUNNER_TEMP/build_artifacts/ {} + 2>/dev/null || true
          find . -name "*.jar" ! -name "gradle-wrapper.jar" -exec cp -t $RUNNER_TEMP/build_artifacts/ {} + 2>/dev/null || true
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json $RUNNER_TEMP/build_artifacts/
          elif [ -f "plugins.json" ]; then
            cp plugins.json $RUNNER_TEMP/build_artifacts/
          fi
          if [ -f "repo.json" ]; then
            cp repo.json $RUNNER_TEMP/build_artifacts/
          fi
          ls -la $RUNNER_TEMP/build_artifacts/

      - name: Upload Build Artifacts (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: ${{ runner.temp }}/build_artifacts/*
          retention-days: 14
          if-no-files-found: warn

      - name: Deploy to Builds Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B builds
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          if [ -d "$RUNNER_TEMP/build_artifacts" ]; then
            cp -r "$RUNNER_TEMP/build_artifacts/." ./
          fi
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Automated build: ${{ github.sha }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" builds --force
          fi
