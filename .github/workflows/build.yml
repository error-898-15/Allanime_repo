name: Build Plugins

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Normalize Manifests & Prepare Environment
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +
          echo "Environment ready."

      - name: Build Plugins & Manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x gradlew || true
          ./gradlew make makePluginsJson --stacktrace || ./gradlew makePluginsJson --stacktrace || ./gradlew :BlakitePlugin:make :ZLivePlugin:make :FojikPlugin:make makePluginsJson --stacktrace

      - name: Collect Build Artifacts
        run: |
          echo "=== Collecting Artifacts ==="
          mkdir -p "$RUNNER_TEMP/build_artifacts"

          find . -type f -name "*.cs3" -exec cp -t "$RUNNER_TEMP/build_artifacts" {} + 2>/dev/null || true
          find . -type f -name "*.jar" ! -name "gradle-wrapper.jar" -exec cp -t "$RUNNER_TEMP/build_artifacts" {} + 2>/dev/null || true

          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json "$RUNNER_TEMP/build_artifacts/plugins.json"
            echo "Collected build/plugins.json"
          elif [ -f "plugins.json" ]; then
            cp plugins.json "$RUNNER_TEMP/build_artifacts/plugins.json"
            echo "Collected plugins.json"
          fi

          if [ -f "repo.json" ]; then
            cp repo.json "$RUNNER_TEMP/build_artifacts/repo.json"
            echo "Collected repo.json"
          fi

          if [ -f "icon.png" ]; then
            cp icon.png "$RUNNER_TEMP/build_artifacts/icon.png"
            echo "Collected icon.png"
          fi

          echo "Collected files:"
          ls -la "$RUNNER_TEMP/build_artifacts"

      - name: Upload Build Artifacts (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: ${{ runner.temp }}/build_artifacts/*
          retention-days: 14

      - name: Deploy to Builds Branch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git checkout -B builds
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/build_artifacts"/* ./

          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit to builds branch."
          else
            git commit -m "Automated build: ${{ github.sha }}"
            git push origin builds --force
          fi
