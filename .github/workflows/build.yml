name: Build and Publish Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Plugins
        run: ./gradlew make

      - name: Update Plugins Metadata & Hashes
        run: python3 .github/scripts/update_plugins.py

      - name: Deploy to GitHub Pages / Release Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated build: Update plugins and metadata [skip ci]"
            git push origin main
          fi
